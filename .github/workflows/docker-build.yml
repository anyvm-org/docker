name: Build and Publish Docker Image

on:
  push:
    branches: ['**']          # build on any branch push; tag = branch name
  release:
    types: [published]        # tag = release tag + latest

permissions:
  contents: read
  packages: write             # needed for GHCR

env:
  # Override GHCR image name via repo variable GHCR_IMAGE_NAME; defaults to repo name.
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/anyvm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta (branch/release tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          # `tags` is a YAML block scalar, so a '#' here is CONTENT, not a
          # YAML comment -- metadata-action parses it. Since v6 only a
          # FULL-LINE '#' is treated as a comment; a trailing one is kept as
          # part of the value ("List inputs now preserve # inside values
          # while still supporting full-line # comments", v6.0.0 / PR 607),
          # which made v6 reject "type=ref,event=branch   # branch name on
          # push" as an invalid event. Keep every comment on its own line.
          tags: |
            # branch name on push
            type=ref,event=branch
            # release tag on published release
            type=ref,event=tag
            # latest only on release
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
